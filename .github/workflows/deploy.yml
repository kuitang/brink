name: Deploy to Fly.io

on:
  # Deploy after CI workflow completes successfully on main
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    # Only deploy if CI passed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v7
        with:
          # Checkout the commit that triggered the CI workflow
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --no-cache
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify the public lobby responds after deployment
        run: |
          curl --fail --silent --show-error --location \
            --retry 4 --retry-all-errors --retry-max-time 90 --max-time 15 \
            --output /dev/null https://brink.fly.dev/
